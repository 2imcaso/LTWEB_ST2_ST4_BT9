<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body class="auth-page">
<main class="auth-card">
    <h1>IOTSTAR SHOP</h1><h2>Đăng nhập</h2>
    <p>Đăng nhập bằng email để truy cập tài khoản.</p>
    <div class="alert error" role="alert" th:if="${param.error}">Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị vô hiệu hóa.</div>
    <div class="alert success" role="status" th:if="${param.logout}">Bạn đã đăng xuất.</div>
    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" required autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button class="btn primary full" type="submit">Đăng nhập</button>
    </form>
    <p><a th:href="@{/}">Về trang chủ</a></p>
</main>
</body>
</html>
