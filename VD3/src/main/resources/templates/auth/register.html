<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng ký</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><section class="auth-card"><h1>Đăng ký</h1><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><form th:action="@{/register}" th:object="${registerDTO}" method="post"><label>Username</label><input th:field="*{username}"><small class="error-text" th:errors="*{username}"></small><label>Email</label><input type="email" th:field="*{email}"><small class="error-text" th:errors="*{email}"></small><label>Họ tên</label><input th:field="*{fullName}"><label>Mật khẩu</label><input type="password" th:field="*{password}"><label>Xác nhận mật khẩu</label><input type="password" th:field="*{confirmPassword}"><button class="btn primary full">Đăng ký và nhận OTP</button></form><p><a th:href="@{/login}">Đã có tài khoản?</a></p></section></body></html>
