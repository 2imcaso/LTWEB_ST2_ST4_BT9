<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><section class="auth-card"><h1>Đặt lại mật khẩu</h1><div class="alert success" th:if="${developmentOtp}">Chế độ phát triển - OTP: <b th:text="${developmentOtp}"></b></div><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post"><label>Email</label><input type="email" th:field="*{email}"><label>OTP</label><input th:field="*{otp}" maxlength="6"><label>Mật khẩu mới</label><input type="password" th:field="*{password}"><label>Xác nhận mật khẩu</label><input type="password" th:field="*{confirmPassword}"><button class="btn primary full">Đổi mật khẩu</button></form></section></body></html>
