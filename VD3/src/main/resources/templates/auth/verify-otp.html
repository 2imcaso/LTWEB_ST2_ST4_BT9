<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Xác nhận OTP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><section class="auth-card"><h1>Xác nhận OTP</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert success" th:if="${developmentOtp}">Chế độ phát triển - OTP: <b th:text="${developmentOtp}"></b></div><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post"><label>Email</label><input type="email" th:field="*{email}"><label>OTP 6 số</label><input th:field="*{otp}" maxlength="6"><button class="btn primary full">Xác nhận</button></form><form th:action="@{/resend-register-otp}" method="post"><input type="hidden" name="email" th:value="${verifyOtpDTO.email}"><button class="btn full">Gửi lại OTP</button></form></section></body></html>
