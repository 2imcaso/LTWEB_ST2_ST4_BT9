<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Sản phẩm</title></head><body><main layout:fragment="content"><section class="panel"><h1 th:text="${mode=='create'?'Thêm sản phẩm':'Sửa sản phẩm'}"></h1><form th:object="${productDTO}" enctype="multipart/form-data" method="post" th:action="${mode=='create'}?@{/products/create}:@{/products/edit/{id}(id=${productDTO.id})}"><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><label>Tên</label><input th:field="*{name}"><small class="error-text" th:errors="*{name}"></small><label>Mô tả</label><textarea th:field="*{description}"></textarea><label>Giá</label><input type="number" step="0.01" th:field="*{price}"><small class="error-text" th:errors="*{price}"></small><label>Ảnh Cloudinary</label><input type="file" name="image" accept="image/*"><img class="thumb" th:if="*{imageUrl}" th:src="*{imageUrl}"><button class="btn primary">Lưu</button> <a class="btn" th:href="@{/products}">Hủy</a></form></section></main></body></html>
