<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Sản phẩm</title></head><body><main layout:fragment="content"><h1>Quản lý sản phẩm</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="toolbar"><form th:action="@{/products}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Tên, mô tả"><button class="btn primary">Tìm</button></form><a class="btn primary" th:href="@{/products/create}">Thêm sản phẩm</a></div><table><thead><tr><th>Ảnh</th><th>Tên</th><th>Giá</th><th>User</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p:${products.content}"><td><img class="thumb" th:if="${p.imageUrl}" th:src="${p.imageUrl}"><span th:unless="${p.imageUrl}">Chưa có</span></td><td th:text="${p.name}"></td><td th:text="${#numbers.formatDecimal(p.price,0,'COMMA',2,'POINT')}"></td><td th:text="${p.username}"></td><td class="actions"><a th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a><form th:action="@{/products/delete/{id}(id=${p.id})}" method="post"><button>Xóa</button></form></td></tr></tbody></table><div class="pagination"><a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number-1},size=${size},keyword=${keyword})}">«</a><span th:text="${products.number+1}+' / '+${products.totalPages}"></span><a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number+1},size=${size},keyword=${keyword})}">»</a></div></main></body></html>
