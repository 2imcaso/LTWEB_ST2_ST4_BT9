<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>User</title></head><body><main layout:fragment="content"><section class="panel"><h1 th:text="${mode=='create'?'Thêm user':'Sửa user'}"></h1><form th:object="${userDTO}" method="post" th:action="${mode=='create'}?@{/users/create}:@{/users/edit/{id}(id=${userDTO.id})}"><label>Username</label><input th:field="*{username}"><small class="error-text" th:errors="*{username}"></small><label>Email</label><input type="email" th:field="*{email}"><small class="error-text" th:errors="*{email}"></small><label>Họ tên</label><input th:field="*{fullName}"><label>Role</label><select th:field="*{roleId}"><option th:each="r:${roles}" th:value="${r.id}" th:text="${r.name}"></option></select><label><input type="checkbox" th:field="*{enabled}"> Enabled</label><button class="btn primary">Lưu</button> <a class="btn" th:href="@{/users}">Hủy</a></form><p th:if="${mode=='create'}">Mật khẩu mặc định: <b>123456</b></p></section></main></body></html>
