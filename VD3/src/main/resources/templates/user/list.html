<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Người dùng</title></head><body><main layout:fragment="content"><h1>Quản lý người dùng</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="toolbar"><form th:action="@{/users}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Username, email, họ tên"><button class="btn primary">Tìm</button></form><a class="btn primary" th:href="@{/users/create}">Thêm user</a></div><table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Họ tên</th><th>Role</th><th>Trạng thái</th><th>Products</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u:${users.content}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td th:text="${u.roleName}"></td><td th:text="${u.enabled?'ACTIVE':'INACTIVE'}"></td><td th:text="${u.productCount}"></td><td class="actions"><a th:href="@{/users/edit/{id}(id=${u.id})}">Sửa</a><form th:action="@{/users/delete/{id}(id=${u.id})}" method="post"><button>Xóa</button></form></td></tr></tbody></table><div class="pagination"><a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number-1},size=${size},keyword=${keyword})}">«</a><span th:text="${users.number+1}+' / '+${users.totalPages}"></span><a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number+1},size=${size},keyword=${keyword})}">»</a></div></main></body></html>
